<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Review - English Recap</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="header-title">&#127919; Review</div>
        <div class="header-date" id="headerDate"></div>
      </div>
      <a href="index.html" class="avatar" title="Back">&#127968;</a>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><span class="stat-num" id="statDays3">0</span><span class="stat-label">Streak</span></div>
      <div class="stat-item"><span class="stat-num" id="statVocab3">0</span><span class="stat-label">Vocab</span></div>
      <div class="stat-item"><span class="stat-num" id="statDue3">0</span><span class="stat-label">Due</span></div>
    </div>
  </div>
</header>
<nav class="nav-tabs">
  <a href="index.html" class="nav-tab">&#128214; Article</a>
  <a href="vocab.html" class="nav-tab">&#128218; Vocab</a>
  <a href="#" class="nav-tab active">&#127919; Review</a>
</nav>
<div class="container">
  <div id="reviewCounter" class="review-counter"></div>
  <div id="reviewContent"></div>
  <div id="reviewRating" class="review-rating" style="display:none">
    <button class="rating-btn red" id="ratingBtn0">&#128165; No</button>
    <button class="rating-btn orange" id="ratingBtn1">&#129318; Vague</button>
    <button class="rating-btn green" id="ratingBtn2">&#128302; Yes</button>
  </div>
</div>
<div class="modal-overlay" id="wordModal">
  <div class="modal">
    <div class="modal-word" id="modalWord"></div>
    <div class="modal-ipa" id="modalIpa"></div>
    <div class="modal-zh" id="modalZh"></div>
    <div class="modal-example" id="modalExample"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
(function(){
  document.getElementById("headerDate").textContent = new Date().toISOString().split("T")[0];
  if(typeof loadVocab==="function") loadVocab();
  if(typeof updateStreak==="function") updateStreak();
  if(typeof updateStatsAll==="function") updateStatsAll();
  if(typeof prepareReview==="function") prepareReview();
  document.getElementById("wordModal").addEventListener("click", function(e) {
    if (e.target.classList.contains("modal-overlay")) closeModal();
  });
})();
</script>
</body>
</html>
